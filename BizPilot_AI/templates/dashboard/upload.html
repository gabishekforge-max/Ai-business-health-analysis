{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">Upload Business CSV</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-2"></i>Upload & Analyze</button>
                    <a href="{% url 'sample_data' %}" class="btn btn-outline-secondary ms-2">Use Sample CSV</a>
                </form>
                <hr class="my-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-1">Need a format reference?</h6>
                        <small class="text-muted">Download sample template CSV with required schema columns.</small>
                    </div>
                    <a href="{% url 'download_sample' %}" class="btn btn-sm btn-outline-primary"><i class="bi bi-download me-1"></i>Download Sample CSV</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
